name: Build Android APK from HTML

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout HTML
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: "temurin"
        java-version: "17"

    - name: Generate Android Project
      run: |
        mkdir -p app/src/main/java/org/digitalindia/krishnagiri
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/assets

        # Copy HTML & Assets into Android assets
        cp index.html app/src/main/assets/index.html
        [ -f manifest.json ] && cp manifest.json app/src/main/assets/
        [ -f sw.js ] && cp sw.js app/src/main/assets/
        [ -f icon-192.png ] && cp icon-192.png app/src/main/assets/
        [ -f icon-512.png ] && cp icon-512.png app/src/main/assets/

        # Create settings.gradle
        cat << "EOF" > settings.gradle
        rootProject.name = "DigitalIndiaKrishnagiri"
        include ":app"
        EOF

        # Create root build.gradle
        cat << "EOF" > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath "com.android.tools.build:gradle:8.10.2"
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # Create gradle.properties
        cat << "EOF" > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

        # Create app/build.gradle
        cat << "EOF" > app/build.gradle
        plugins {
            id "com.android.application"
        }

        android {
            namespace "org.digitalindia.krishnagiri"
            compileSdk 34

            defaultConfig {
                applicationId "org.digitalindia.krishnagiri"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "3.0.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation "androidx.appcompat:appcompat:1.6.1"
            implementation "androidx.webkit:webkit:1.10.0"
        }
        EOF

        # Create AndroidManifest.xml
        cat << "EOF" > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.VIBRATE" />

            <application
                android:allowBackup="true"
                android:icon="@android:drawable/sym_def_app_icon"
                android:label="Digital India Krishnagiri"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|keyboardHidden">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>

        </manifest>
        EOF

        # Create strings.xml and styles.xml
        cat << "EOF" > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Digital India Krishnagiri</string>
        </resources>
        EOF

        cat << "EOF" > app/src/main/res/values/styles.xml
        <resources>
            <style name="Theme.AppCompat.Light.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">
                <item name="android:windowNoTitle">true</item>
                <item name="android:windowActionBar">false</item>
                <item name="android:windowFullscreen">true</item>
            </style>
        </resources>
        EOF

        # Create MainActivity.java
        cat << "EOF" > app/src/main/java/org/digitalindia/krishnagiri/MainActivity.java
        package org.digitalindia.krishnagiri;

        import android.annotation.SuppressLint;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {

            private WebView webView;

            @SuppressLint("SetJavaScriptEnabled")
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                webView = new WebView(this);
                setContentView(webView);

                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webSettings.setDatabaseEnabled(true);
                webSettings.setAllowFileAccess(true);
                webSettings.setAllowContentAccess(true);
                webSettings.setLoadWithOverviewMode(true);
                webSettings.setUseWideViewPort(true);

                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("file:///android_asset/index.html");
            }

            @Override
            public void onBackPressed() {
                if (webView != null && webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: "8.2.2"

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Digital_India_Krishnagiri_School_APK
        path: app/build/outputs/apk/debug/app-debug.apk
