name: Build Signed Android APK & Deploy GitHub Pages

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android Native Project Structure
        run: |
          mkdir -p app/src/main/java/org/digitalindia/krishnagiri
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/assets

          # Copy Web Files to Assets
          cp index.html app/src/main/assets/index.html
          [ -f manifest.json ] && cp manifest.json app/src/main/assets/
          [ -f sw.js ] && cp sw.js app/src/main/assets/
          [ -f icon-192.png ] && cp icon-192.png app/src/main/assets/
          [ -f icon-512.png ] && cp icon-512.png app/src/main/assets/
          [ -f icon-512.png ] && cp icon-512.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          # Generate settings.gradle
          cat << 'SETTINGSEOF' > settings.gradle
          rootProject.name = "DigitalIndiaKrishnagiri"
          include ':app'
          SETTINGSEOF

          # Generate root build.gradle
          cat << 'ROOTGRADLE' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.2.2"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          ROOTGRADLE

          # Generate gradle.properties
          cat << 'GRADLEPROP' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          GRADLEPROP

          # Generate Keystore for Release Signing
          keytool -genkey -v -keystore release.jks -alias digitalindia -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "DigitalIndia2026" -keypass "DigitalIndia2026" \
            -dname "CN=Digital India, OU=GBHSS Krishnagiri, O=TamilNadu School Education, L=Krishnagiri, ST=Tamil Nadu, C=IN"

          # Generate app/build.gradle with Signing Config
          cat << 'APPGRADLE' > app/build.gradle
          plugins {
              id "com.android.application"
          }

          android {
              namespace "org.digitalindia.krishnagiri"
              compileSdk 34

              defaultConfig {
                  applicationId "org.digitalindia.krishnagiri"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "3.0.0"
              }

              signingConfigs {
                  release {
                      storeFile file("../release.jks")
                      storePassword "DigitalIndia2026"
                      keyAlias "digitalindia"
                      keyPassword "DigitalIndia2026"
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation "androidx.appcompat:appcompat:1.6.1"
              implementation "androidx.webkit:webkit:1.10.0"
          }
          APPGRADLE

          # Generate AndroidManifest.xml
          cat << 'MANIFESTEOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Digital India Krishnagiri"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFESTEOF

          # Generate strings.xml and styles.xml
          cat << 'STRINGS' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Digital India Krishnagiri</string>
          </resources>
          STRINGS

          cat << 'STYLES' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.AppCompat.Light.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
                  <item name="android:windowFullscreen">true</item>
              </style>
          </resources>
          STYLES

          # Generate MainActivity.java with Offline Local Assets WebView Support
          cat << 'JAVA' > app/src/main/java/org/digitalindia/krishnagiri/MainActivity.java
          package org.digitalindia.krishnagiri;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setDatabaseEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);
                  webSettings.setLoadWithOverviewMode(true);
                  webSettings.setUseWideViewPort(true);
                  webSettings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          JAVA

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Signed Release APK
        run: gradle assembleRelease

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Digital_India_Krishnagiri_School_Signed_APK
          path: app/build/outputs/apk/release/app-release.apk
